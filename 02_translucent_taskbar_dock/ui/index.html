<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultra Dock</title>
<style>
:root{
  --ink:#f3f4f6; --ink-2:rgba(243,244,246,.68); --ink-3:rgba(243,244,246,.45);
  --fill:rgba(255,255,255,.06); --fill-hover:rgba(255,255,255,.12); --fill-active:rgba(255,255,255,.18);
  --line:rgba(255,255,255,.10);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;height:100%}
body{color:var(--ink);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid rgba(120,160,255,.9);outline-offset:1px;border-radius:8px}

/* Browser preview only (never inside the real app) */
body.preview{background:radial-gradient(1200px 600px at 50% 100%,#2b3350,#0c0f18 70%)}
body.preview .shell{background:rgba(22,25,33,.72);backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
body.preview .note{display:block}
.note{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);color:var(--ink-2);font-size:12px;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:999px}

.shell{position:absolute;left:0;bottom:0;width:max-content;min-width:300px;max-width:960px;padding:8px}
body.preview .shell{left:50%;bottom:24px;transform:translateX(-50%)}

.drawer{display:none;padding:8px 8px 10px;margin-bottom:8px;border-bottom:1px solid var(--line);animation:up .16s cubic-bezier(.16,1,.3,1)}
.drawer.open{display:block}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px}
.drawer-h b{font:600 13px var(--font-display)}
.drawer-h span{color:var(--ink-3);font-size:11.5px}
.apps{display:grid;grid-template-columns:repeat(4,104px);gap:6px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:12px;transition:background .12s}
.app:hover{background:var(--fill-hover)}
.app:active{background:var(--fill-active)}
.app.busy{opacity:.55}
.ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:700 15px var(--font-display);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.app .n{font-size:12px;text-align:center;line-height:1.25;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--ink-2);padding:14px 4px;max-width:420px}

.menu{display:grid;gap:2px;min-width:240px}
.mi{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 10px;border-radius:8px;text-align:left}
.mi:hover{background:var(--fill-hover)}
.mi small{color:var(--ink-3)}
.seg{display:flex;gap:2px;background:var(--fill);border-radius:8px;padding:2px}
.seg button{padding:4px 9px;border-radius:6px;font-size:11.5px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--fill-active);color:var(--ink)}
.sep{height:1px;background:var(--line);margin:4px 2px}

.bar{display:flex;align-items:center;gap:4px}
.pill{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border-radius:10px;font-weight:600;font-size:13px;transition:background .12s;white-space:nowrap}
.pill:hover{background:var(--fill-hover)}
.pill[aria-expanded=true]{background:var(--fill-active)}
.pill .sw{width:10px;height:10px;border-radius:3px}
.pill .c{font-size:11px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.more{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.more:hover{background:var(--fill-hover)}
.more[aria-expanded=true]{background:var(--fill-active)}
.div{width:1px;height:22px;background:var(--line);margin:0 4px}
.toast{position:absolute;left:8px;right:8px;top:-34px;text-align:center;font-size:12px;color:#fff;background:rgba(208,59,59,.92);padding:6px 10px;border-radius:8px;display:none}
.toast.show{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="note">Preview in a browser. The real dock runs as a translucent window above your taskbar.</div>
<div class="shell" id="shell">
  <div class="drawer" id="drawer" role="region" aria-live="polite"></div>
  <nav class="bar" id="bar" aria-label="App categories"></nav>
</div>
<script>
const T = window.__TAURI__;
const invoke = T && T.core ? T.core.invoke : null;
if (!invoke) document.body.classList.add("preview");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let cfg = null, open = null; // open = category id | "menu" | null
let position = store.get("position", null);

const FALLBACK = { dock:{position:"center"}, categories:[
  {id:"tools",name:"Tools",color:"#10b981",apps:[{name:"Code Red Alarm",url:"http://localhost:8081",available:true},{name:"PC Sentinel",url:"http://localhost:8084",available:true}]}]};

async function load(){
  try { cfg = invoke ? await invoke("get_config") : await fetch("../config/categories.json").then(r => r.json()); }
  catch { cfg = FALLBACK; }
  if (!invoke) cfg.categories.forEach(c => c.apps.forEach(a => a.available = true));
  if (!position) position = (cfg.dock && cfg.dock.position) || "center";
  render();
}
const avail = (c) => (c.apps || []).filter(a => a.available);
const initials = (n) => n.split(/[\s.]+/).filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();

function render(){
  const cats = (cfg.categories || []).filter(c => avail(c).length);
  document.getElementById("bar").innerHTML =
    cats.map(c => `<button class="pill" data-cat="${esc(c.id)}" aria-expanded="${open === c.id}" title="${esc(c.name)}">
      <span class="sw" style="background:${esc(c.color || "#888")}"></span>${esc(c.name)}<span class="c">${avail(c).length}</span></button>`).join("")
    + `<span class="div"></span><button class="more" id="more" aria-label="Dock menu" aria-expanded="${open === "menu"}">
       <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>`;
  const d = document.getElementById("drawer");
  if (open === "menu") {
    d.innerHTML = `<div class="menu">
      <div class="mi" style="cursor:default"><span>Position</span><span class="seg">${["left","center","right"].map(p => `<button data-pos="${p}" aria-pressed="${position === p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}</span></div>
      <button class="mi" data-act="edit"><span>Edit apps</span><small>opens apps.json</small></button>
      <button class="mi" data-act="reload"><span>Reload apps</span><small>after editing</small></button>
      <div class="sep"></div>
      <button class="mi" data-act="quit"><span>Quit dock</span><small></small></button></div>`;
  } else if (open) {
    const c = cfg.categories.find(x => x.id === open), apps = c ? avail(c) : [];
    d.innerHTML = `<div class="drawer-h"><b>${esc(c ? c.name : "")}</b><span>Esc to close</span></div>` + (apps.length
      ? `<div class="apps" style="grid-template-columns:repeat(${Math.min(4, apps.length)},104px)">${apps.map((a, i) => `
        <button class="app" data-i="${i}" title="${esc(a.resolved || a.url || a.name)}">
          <span class="ico" style="background:${esc(c.color || "#666")}">${esc(initials(a.name))}</span><span class="n">${esc(a.name)}</span></button>`).join("")}</div>`
      : `<div class="empty">None of these apps are installed. Use ⋯ → Edit apps to add your own.</div>`);
  }
  d.classList.toggle("open", !!open);
  if (cfg.error) toast(cfg.error);
  requestAnimationFrame(fit);
}

function fit(){
  if (!invoke) return;
  const r = document.getElementById("shell").getBoundingClientRect();
  invoke("set_layout", { width: Math.ceil(r.width), height: Math.ceil(r.height), position }).catch(() => {});
}

let toastTimer;
function toast(msg){
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; document.getElementById("shell").appendChild(t); }
  t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
  if (!open) { open = null; }
}

document.getElementById("bar").addEventListener("click", (e) => {
  const p = e.target.closest("[data-cat]"), m = e.target.closest("#more");
  if (p) { open = open === p.dataset.cat ? null : p.dataset.cat; render(); }
  if (m) { open = open === "menu" ? null : "menu"; render(); }
});
document.getElementById("drawer").addEventListener("click", async (e) => {
  const a = e.target.closest("[data-i]"), pos = e.target.closest("[data-pos]"), act = e.target.closest("[data-act]");
  if (a) {
    const c = cfg.categories.find(x => x.id === open), app = avail(c)[+a.dataset.i];
    a.classList.add("busy");
    try {
      if (invoke) await invoke("launch", { path: app.resolved || null, args: app.args || null, url: app.url || null });
      else window.open(app.url || "#", "_blank");
      open = null; render();
    } catch (err) { a.classList.remove("busy"); toast(String(err)); }
  }
  if (pos) { position = pos.dataset.pos; store.set("position", position); render(); }
  if (act) {
    const k = act.dataset.act;
    if (k === "edit" && invoke) invoke("open_config").catch(err => toast(String(err)));
    if (k === "reload") { open = null; await load(); }
    if (k === "quit" && invoke) invoke("quit");
  }
});
window.addEventListener("keydown", (e) => { if (e.key === "Escape" && open) { open = null; render(); } });
window.addEventListener("blur", () => { if (open && invoke) { open = null; render(); } });
window.addEventListener("resize", () => { if (invoke) requestAnimationFrame(fit); });
load();
</script>
</body>
</html>
