<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultra Dock</title>
<style>
/* Matches the Windows 11 taskbar: 40px buttons, 4px corners, soft hover, small running bar */
:root{
  --ink:#ffffff; --ink-2:rgba(255,255,255,.72); --ink-3:rgba(255,255,255,.46);
  --hover:rgba(255,255,255,.075); --press:rgba(255,255,255,.04); --open:rgba(255,255,255,.1);
  --bar:rgba(255,255,255,.55); --bar-active:#60cdff; --line:rgba(255,255,255,.12);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --ease:cubic-bezier(.2,.9,.25,1);
}
@media (prefers-color-scheme: light){:root{ --ink:#000; --ink-2:rgba(0,0,0,.66); --ink-3:rgba(0,0,0,.42);
  --hover:rgba(0,0,0,.05); --press:rgba(0,0,0,.03); --open:rgba(0,0,0,.07); --bar:rgba(0,0,0,.42); --bar-active:#005fb8; --line:rgba(0,0,0,.1); }}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden}
body{font:12px/1 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:default;outline:none}

.strip{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap}
.group{display:flex;align-items:center;height:100%}
.grp{position:relative;height:40px;min-width:40px;padding:0 6px;border-radius:4px;display:flex;align-items:center;gap:6px;transition:background .12s}
.grp:hover{background:var(--hover)} .grp:active{background:var(--press)}
.grp[aria-expanded=true]{background:var(--open)}
.stack{position:relative;width:28px;height:24px}
.stack img,.stack .ph{position:absolute;top:50%;width:20px;height:20px;border-radius:5px;transform:translateY(-50%);box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
.stack img:nth-child(1),.stack .ph:nth-child(1){left:0;z-index:3}
.stack img:nth-child(2),.stack .ph:nth-child(2){left:5px;z-index:2;opacity:.85;transform:translateY(-50%) scale(.9)}
.stack img:nth-child(3),.stack .ph:nth-child(3){left:10px;z-index:1;opacity:.6;transform:translateY(-50%) scale(.8)}
.stack.single{width:22px}
.ph{background:var(--line)}
.cnt{font-size:11px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:8px}
.grp .runbar{position:absolute;left:50%;bottom:2px;width:6px;height:3px;border-radius:2px;background:var(--bar);transform:translateX(-50%);transition:width .2s var(--ease),background .2s}
.grp.has-active .runbar{width:14px;background:var(--bar-active)}
.tray{display:flex;align-items:center;height:100%;width:0;overflow:hidden;transition:width .32s var(--ease)}
.tray .inner{display:flex;align-items:center;gap:0;padding:0 2px}
.win{position:relative;width:40px;height:40px;border-radius:4px;display:grid;place-items:center;flex:none;transition:background .12s,transform .15s var(--ease);opacity:0;transform:translateX(-6px)}
.tray.open .win{opacity:1;transform:none;transition:background .12s,opacity .25s var(--ease),transform .3s var(--ease)}
.win:hover{background:var(--hover)} .win:active{background:var(--press);transform:scale(.94)}
.win img{width:24px;height:24px;display:block}
.win .ph{width:24px;height:24px;border-radius:6px}
.win .runbar{position:absolute;left:50%;bottom:2px;width:6px;height:3px;border-radius:2px;background:var(--bar);transform:translateX(-50%);transition:width .2s var(--ease)}
.win.active .runbar{width:16px;background:var(--bar-active)}
.more{width:28px;height:40px;border-radius:4px;display:grid;place-items:center;color:var(--ink-3);transition:background .12s,color .12s}
.more:hover{background:var(--hover);color:var(--ink-2)}
.more svg{width:14px;height:14px;transition:transform .3s var(--ease)}
.more[aria-expanded=true] svg{transform:rotate(180deg)}
.act{height:40px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.act:hover{background:var(--hover);color:var(--ink)}
.act.on{color:var(--bar-active)}
.empty-hint{font-size:11px;color:var(--ink-3);padding:0 6px}

/* ---------- Uninstall survey ---------- */
body.survey{overflow:auto;background:#f6f7f9;color:#111;font-size:14px;line-height:1.5}
@media (prefers-color-scheme: dark){body.survey{background:#17181b;color:#f0efec}}
.sv{max-width:480px;margin:0 auto;padding:28px 26px}
.sv h1{font:600 20px/1.3 "Segoe UI Variable Display","Segoe UI",sans-serif;margin-bottom:6px}
.sv p{opacity:.72;margin-bottom:18px}
.sv label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid rgba(127,127,127,.25);border-radius:10px;margin-bottom:8px;cursor:pointer}
.sv label:has(input:checked){border-color:#2a78d6;background:rgba(42,120,214,.08)}
.sv textarea{width:100%;min-height:80px;margin-top:6px;border-radius:10px;border:1px solid rgba(127,127,127,.35);padding:10px;font:inherit;background:transparent;color:inherit;resize:vertical}
.sv .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.sv button{height:40px;padding:0 18px;border-radius:10px;font-weight:600;cursor:pointer;border:1px solid rgba(127,127,127,.35)}
.sv button.primary{background:#2a78d6;border-color:#2a78d6;color:#fff}
.sv small{display:block;opacity:.55;margin-top:12px}
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<div class="sv" id="survey" hidden>
  <h1>Sorry to see you go</h1>
  <p>Before Ultra Suite is removed, would you tell us why? It takes five seconds and helps make it better for everyone.</p>
  <form id="sf">
    <label><input type="radio" name="r" value="not-useful"> It isn't useful for me</label>
    <label><input type="radio" name="r" value="too-complicated"> Too complicated to set up</label>
    <label><input type="radio" name="r" value="something-broke"> Something didn't work</label>
    <label><input type="radio" name="r" value="performance"> It slowed my PC down</label>
    <label><input type="radio" name="r" value="found-better"> I found a better app</label>
    <label><input type="radio" name="r" value="reinstalling"> Just reinstalling</label>
    <label><input type="radio" name="r" value="other"> Something else</label>
    <textarea id="sm" maxlength="1000" placeholder="Anything else? (optional)"></textarea>
    <div class="row"><button type="button" id="skip">Skip</button><button type="submit" class="primary" id="send">Send and uninstall</button></div>
    <small>Anonymous: only your answer, the app version and Windows are sent.</small>
  </form>
</div>
<script>
const T = window.__TAURI__, invoke = T && T.core ? T.core.invoke : null;
const view = new URLSearchParams(location.search).get("view") || "strip";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (id) => document.getElementById(id);

/* ---------------- Uninstall survey ---------------- */
if (view === "survey") {
  document.body.className = "survey"; $("survey").hidden = false; $("strip").hidden = true;
  const done = () => invoke && invoke("quit");
  $("skip").onclick = async () => { if (invoke) await invoke("send_event", { kind: "uninstall", reason: null, message: null }).catch(() => {}); done(); };
  $("sf").onsubmit = async (e) => {
    e.preventDefault(); $("send").disabled = true; $("send").textContent = "Sending…";
    const r = (document.querySelector("input[name=r]:checked") || {}).value || "unspecified";
    if (invoke) await invoke("send_event", { kind: "uninstall", reason: r, message: $("sm").value.trim() || null }).catch(() => {});
    done();
  };
}

/* ---------------- Taskbar organizer ---------------- */
const icons = new Map();          // exe path -> data url
let state = { windows: [], organize: true, order: [] }, open = null, sig = "", closeTimer = 0;
const CHEV = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>';

function iconFor(exe, hwnd){
  if (icons.has(exe)) return icons.get(exe);
  icons.set(exe, null);
  if (invoke) invoke("get_icon", { target: exe, hwnd: hwnd ?? null }).then(u => { if (u) { icons.set(exe, u); document.querySelectorAll(`img[data-exe="${CSS.escape(exe)}"]`).forEach(i => i.src = u);
    document.querySelectorAll(`.ph[data-exe="${CSS.escape(exe)}"]`).forEach(p => { const i = document.createElement("img"); i.dataset.exe = exe; i.src = u; i.alt = ""; p.replaceWith(i); }); } }).catch(() => {});
  return null;
}
const hwndOf = (exe) => (state.windows.find(w => w.exe === exe) || {}).hwnd;
const img = (exe) => { const u = iconFor(exe, hwndOf(exe)); return u ? `<img data-exe="${esc(exe)}" src="${u}" alt="">` : `<span class="ph" data-exe="${esc(exe)}"></span>`; };

function groups(){
  const by = new Map();
  for (const w of state.windows) { if (!by.has(w.category)) by.set(w.category, []); by.get(w.category).push(w); }
  const order = state.order.length ? state.order : [...by.keys()];
  return [...by.entries()].sort((a, b) => (order.indexOf(a[0]) + 1 || 99) - (order.indexOf(b[0]) + 1 || 99));
}

function render(){
  const gs = groups();
  const html = gs.map(([cat, ws]) => {
    const uniq = []; const seen = new Set(); for (const w of ws) if (!seen.has(w.exe)) { seen.add(w.exe); uniq.push(w); }
    const active = ws.some(w => w.active);
    return `<div class="group" data-cat="${esc(cat)}">
      <button class="grp ${active ? "has-active" : ""}" data-cat="${esc(cat)}" aria-expanded="${open === cat}" title="${esc(cat)}: ${ws.map(w => w.title).slice(0, 6).map(esc).join(" · ")}">
        <span class="stack ${uniq.length === 1 ? "single" : ""}">${uniq.slice(0, 3).map(w => img(w.exe)).join("")}</span>${ws.length > 1 ? `<span class="cnt">${ws.length}</span>` : ""}<span class="runbar"></span></button>
      <div class="tray ${open === cat ? "open" : ""}"><div class="inner">${ws.map(w => `<button class="win ${w.active ? "active" : ""}" data-h="${w.hwnd}" title="${esc(w.title)}">${img(w.exe)}<span class="runbar"></span></button>`).join("")}</div></div></div>`;
  }).join("");
  const menu = `<div class="group" data-cat="__menu"><button class="more" data-cat="__menu" aria-expanded="${open === "__menu"}" title="Ultra Dock">${CHEV}</button>
    <div class="tray ${open === "__menu" ? "open" : ""}"><div class="inner">
      <button class="act ${state.organize ? "" : "on"}" data-act="showall">${state.organize ? "Show all" : "Organize"}</button>
      <button class="act" data-act="sentinel">Sentinel</button><button class="act" data-act="alarm">Alarm</button>
      <button class="act" data-act="edit">Edit</button><button class="act" data-act="quit">Quit</button></div></div></div>`;
  $("strip").innerHTML = html + menu;
  // keep any open tray at its natural width
  $("strip").querySelectorAll(".tray.open").forEach(t => t.style.width = t.querySelector(".inner").scrollWidth + "px");
  requestAnimationFrame(report);
}
function report(){ if (invoke) invoke("set_strip_width", { width: Math.ceil($("strip").scrollWidth) + 2 }); }

function setOpen(cat){
  const prev = open; open = cat;
  $("strip").querySelectorAll(".group").forEach(g => {
    const isOpen = g.dataset.cat === cat, tray = g.querySelector(".tray"), b = g.querySelector(".grp,.more");
    b.setAttribute("aria-expanded", isOpen);
    if (isOpen) { // grow the window first, then slide in
      const w = tray.querySelector(".inner").scrollWidth;
      if (invoke) invoke("set_strip_width", { width: Math.ceil($("strip").scrollWidth + w) + 4 });
      requestAnimationFrame(() => { tray.style.width = w + "px"; tray.classList.add("open"); });
    } else { tray.style.width = "0px"; tray.classList.remove("open"); }
  });
  if (!cat || prev) setTimeout(report, 340); // shrink after sliding closed
}

$("strip").addEventListener("click", async (e) => {
  const g = e.target.closest(".grp,.more"), w = e.target.closest(".win"), a = e.target.closest(".act");
  if (g) { setOpen(open === g.dataset.cat ? null : g.dataset.cat); return; }
  if (w) { if (invoke) await invoke("activate", { hwnd: +w.dataset.h }); setTimeout(() => setOpen(null), 220); return; }
  if (a) {
    const k = a.dataset.act;
    if (k === "showall") { state.organize = !state.organize; if (invoke) await invoke("set_organize", { on: state.organize }); sig = ""; }
    if (k === "sentinel" || k === "alarm") invoke && invoke("open_app_view", { name: k });
    if (k === "edit") invoke && invoke("open_config");
    if (k === "quit") invoke && invoke("quit");
    setTimeout(() => setOpen(null), 150);
  }
});
$("strip").addEventListener("mouseleave", () => { clearTimeout(closeTimer); closeTimer = setTimeout(() => { if (open) setOpen(null); }, 1200); });
$("strip").addEventListener("mouseenter", () => clearTimeout(closeTimer));

async function poll(){
  try {
    const s = invoke ? await invoke("get_windows") : { organize: true, order: [], windows: [] };
    const nsig = JSON.stringify([s.organize, s.windows.map(w => [w.hwnd, w.category, w.active, w.title])]);
    state = s;
    if (nsig !== sig) { sig = nsig; render(); }
  } catch {}
}
if (view === "strip") { poll(); setInterval(poll, 700); }
</script>
</body>
</html>
