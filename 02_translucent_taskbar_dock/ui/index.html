<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultra Suite</title>
<style>
:root{
  --ink:#f5f6f7; --ink-2:rgba(245,246,247,.7); --ink-3:rgba(245,246,247,.45);
  --hover:rgba(255,255,255,.075); --press:rgba(255,255,255,.045); --active:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: light){:root{ --ink:#111; --ink-2:rgba(0,0,0,.66); --ink-3:rgba(0,0,0,.42);
  --hover:rgba(0,0,0,.055); --press:rgba(0,0,0,.035); --active:rgba(0,0,0,.08); --line:rgba(0,0,0,.12); }}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden}
body{font:12px/1 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:default}

/* ---------- Taskbar strip ---------- */
.strip{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:2px;padding:0 2px;white-space:nowrap}
.group{display:flex;align-items:center;height:100%}
.pill{display:flex;align-items:center;gap:7px;height:40px;padding:0 10px 0 8px;border-radius:5px;transition:background .15s}
.pill:hover{background:var(--hover)} .pill:active{background:var(--press)}
.pill[aria-expanded=true]{background:var(--active)}
.pill .sw{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 10px var(--font);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.pill .lb{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.pill .ct{font-size:10.5px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.pill .chev{width:8px;height:8px;border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);transform:rotate(-45deg);margin-left:1px;transition:transform .3s var(--ease)}
.pill[aria-expanded=true] .chev{transform:rotate(135deg)}
.tray{display:flex;align-items:center;gap:1px;height:100%;width:0;overflow:hidden;transition:width .38s var(--ease),opacity .25s;opacity:0}
.tray.open{opacity:1}
.tray .inner{display:flex;align-items:center;gap:1px;padding:0 4px 0 2px;border-left:1px solid transparent}
.app{width:40px;height:40px;border-radius:5px;display:grid;place-items:center;flex:none;transition:background .15s,transform .2s var(--ease)}
.app:hover{background:var(--hover)} .app:active{background:var(--press);transform:scale(.94)}
.app img{width:24px;height:24px;display:block;image-rendering:auto}
.app .mono{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:700 10px var(--font);color:#fff}
.app.busy{opacity:.5}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}
.more{width:32px;height:40px;border-radius:5px;display:grid;place-items:center;color:var(--ink-2)}
.more:hover{background:var(--hover)}
.act{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:5px;font-weight:600;font-size:12px}
.act:hover{background:var(--hover)}
.act svg{width:16px;height:16px}
.toast{position:fixed;right:4px;top:50%;transform:translateY(-50%);background:#c62f2f;color:#fff;font-size:11.5px;padding:5px 8px;border-radius:5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- Uninstall survey ---------- */
body.survey{overflow:auto;background:#f6f7f9;color:#111;font-size:14px;line-height:1.5}
@media (prefers-color-scheme: dark){body.survey{background:#17181b;color:#f0efec}}
.sv{max-width:480px;margin:0 auto;padding:28px 26px}
.sv h1{font:600 20px/1.3 "Segoe UI Variable Display","Segoe UI",sans-serif;margin-bottom:6px}
.sv p{opacity:.72;margin-bottom:18px}
.sv label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid rgba(127,127,127,.25);border-radius:10px;margin-bottom:8px;cursor:pointer;user-select:none}
.sv label:has(input:checked){border-color:#2a78d6;background:rgba(42,120,214,.08)}
.sv textarea{width:100%;min-height:80px;margin-top:6px;border-radius:10px;border:1px solid rgba(127,127,127,.35);padding:10px;font:inherit;background:transparent;color:inherit;resize:vertical}
.sv .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.sv button{height:40px;padding:0 18px;border-radius:10px;font-weight:600;cursor:pointer;border:1px solid rgba(127,127,127,.35)}
.sv button.primary{background:#2a78d6;border-color:#2a78d6;color:#fff}
.sv small{display:block;opacity:.55;margin-top:12px}
</style>
</head>
<body>
<div class="strip" id="strip" hidden></div>
<div class="toast" id="toast"></div>
<div class="sv" id="survey" hidden>
  <h1>Sorry to see you go</h1>
  <p>Before Ultra Suite is removed, would you tell us why? It takes five seconds and helps make it better for everyone.</p>
  <form id="sf">
    <label><input type="radio" name="r" value="not-useful"> It isn't useful for me</label>
    <label><input type="radio" name="r" value="too-complicated"> Too complicated to set up</label>
    <label><input type="radio" name="r" value="something-broke"> Something didn't work</label>
    <label><input type="radio" name="r" value="performance"> It slowed my PC down</label>
    <label><input type="radio" name="r" value="found-better"> I found a better app</label>
    <label><input type="radio" name="r" value="reinstalling"> Just reinstalling</label>
    <label><input type="radio" name="r" value="other"> Something else</label>
    <textarea id="sm" maxlength="1000" placeholder="Anything else? (optional)"></textarea>
    <div class="row"><button type="button" id="skip">Skip</button><button type="submit" class="primary" id="send">Send and uninstall</button></div>
    <small>Anonymous: only your answer, the app version and Windows are sent.</small>
  </form>
</div>
<script>
const T = window.__TAURI__, invoke = T && T.core ? T.core.invoke : null;
const view = new URLSearchParams(location.search).get("view") || "strip";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (id) => document.getElementById(id);

/* ---------------- Uninstall survey ---------------- */
if (view === "survey") {
  document.body.className = "survey"; $("survey").hidden = false;
  const done = () => invoke && invoke("quit");
  $("skip").onclick = async () => { if (invoke) await invoke("send_event", { kind: "uninstall", reason: null, message: null }).catch(() => {}); done(); };
  $("sf").onsubmit = async (e) => {
    e.preventDefault(); $("send").disabled = true; $("send").textContent = "Sending…";
    const r = (document.querySelector("input[name=r]:checked") || {}).value || "unspecified";
    if (invoke) await invoke("send_event", { kind: "uninstall", reason: r, message: $("sm").value.trim() || null }).catch(() => {});
    done();
  };
}

/* ---------------- Taskbar strip ---------------- */
let cfg = null, open = null, closeTimer = 0;
const ICON = {
  alarm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.5M5 4 3 6M19 4l2 2"/></svg>',
  sentinel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l2-6 4 12 2-6h6"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  reload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2 5.3M20 5v6h-6"/></svg>',
  quit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>',
};
const avail = (c) => (c.apps || []).filter(a => a.available);
const initials = (n) => n.split(/[\s.]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }

async function load(){
  try { cfg = invoke ? await invoke("get_config") : await fetch("../config/categories.json").then(r => r.json()); }
  catch { cfg = { categories: [] }; }
  if (!invoke) cfg.categories.forEach(c => c.apps.forEach(a => a.available = true));
  build();
}
function build(){
  const cats = (cfg.categories || []).filter(c => avail(c).length);
  const strip = $("strip"); strip.hidden = false;
  strip.innerHTML = cats.map(c => `<div class="group" data-cat="${esc(c.id)}">
      <button class="pill" data-cat="${esc(c.id)}" aria-expanded="false" title="${esc(c.name)}: ${avail(c).length} apps">
        <span class="sw" style="background:${esc(c.color || "#777")}">${esc(c.name[0])}</span><span class="lb">${esc(c.name)}</span><span class="chev"></span></button>
      <div class="tray"><div class="inner">${avail(c).map((a, i) => `<button class="app" data-cat="${esc(c.id)}" data-i="${i}" title="${esc(a.name)}">
        <span class="mono" style="background:${esc(c.color || "#777")}">${esc(initials(a.name))}</span></button>`).join("")}</div></div></div>`).join("")
    + `<span class="sep"></span><div class="group" data-cat="__menu"><button class="more" data-cat="__menu" aria-expanded="false" title="Ultra Suite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      <div class="tray"><div class="inner">
        <button class="act" data-act="alarm">${ICON.alarm}Alarm</button><button class="act" data-act="sentinel">${ICON.sentinel}Sentinel</button>
        <button class="act" data-act="edit">${ICON.edit}Edit</button><button class="act" data-act="reload">${ICON.reload}Reload</button>
        <button class="act" data-act="quit">${ICON.quit}Quit</button></div></div></div>`;
  // real app icons (Windows shell), filled in as they arrive
  cats.forEach(c => avail(c).forEach((a, i) => {
    const target = a.icon || a.resolved; if (!target || !invoke) return;
    invoke("get_icon", { target }).then(url => {
      if (!url) return;
      const b = strip.querySelector(`.app[data-cat="${CSS.escape(c.id)}"][data-i="${i}"]`);
      if (b) b.innerHTML = `<img src="${url}" alt="">`;
    }).catch(() => {});
  }));
  requestAnimationFrame(() => report(false));
}
function collapsedWidth(){ let w = 4; $("strip").querySelectorAll(".pill,.more,.sep").forEach(el => w += el.getBoundingClientRect().width + (el.classList.contains("sep") ? 6 : 2)); return Math.ceil(w); }
function report(expandedTo){
  const base = collapsedWidth();
  const extra = expandedTo ? expandedTo : 0;
  if (invoke) invoke("set_strip_width", { width: base + extra + 2 });
}
function setOpen(id){
  const strip = $("strip");
  strip.querySelectorAll(".group").forEach(g => {
    const isOpen = g.dataset.cat === id, tray = g.querySelector(".tray"), btn = g.querySelector(".pill,.more");
    btn.setAttribute("aria-expanded", isOpen);
    const inner = tray.querySelector(".inner"), w = isOpen ? inner.scrollWidth : 0;
    tray.classList.toggle("open", isOpen); tray.style.width = w + "px";
  });
  const g = id ? strip.querySelector(`.group[data-cat="${CSS.escape(id)}"] .inner`) : null;
  const target = g ? g.scrollWidth : 0;
  if (target) report(target); // grow the window first, then slide the icons in
  else setTimeout(() => { if (!open) report(false); }, 400); // slide out, then shrink
  open = id;
}
$("strip").addEventListener("click", async (e) => {
  const p = e.target.closest(".pill,.more"), a = e.target.closest(".app"), act = e.target.closest(".act");
  if (p) { setOpen(open === p.dataset.cat ? null : p.dataset.cat); return; }
  if (a) {
    const c = cfg.categories.find(x => x.id === a.dataset.cat), app = avail(c)[+a.dataset.i];
    a.classList.add("busy");
    try { if (invoke) await invoke("launch", { path: app.resolved || null, args: app.args || null, url: app.url || null }); setTimeout(() => setOpen(null), 250); }
    catch (err) { toast(String(err)); }
    a.classList.remove("busy"); return;
  }
  if (act) {
    const k = act.dataset.act;
    if (k === "alarm" || k === "sentinel") invoke && invoke("open_app_view", { name: k });
    if (k === "edit") invoke && invoke("open_config");
    if (k === "reload") { setOpen(null); await load(); }
    if (k === "quit") invoke && invoke("quit");
    setTimeout(() => setOpen(null), 200);
  }
});
// Slide closed shortly after the mouse leaves, like a taskbar flyout
$("strip").addEventListener("mouseleave", () => { clearTimeout(closeTimer); closeTimer = setTimeout(() => setOpen(null), 1400); });
$("strip").addEventListener("mouseenter", () => clearTimeout(closeTimer));
if (view === "strip") load();
</script>
</body>
</html>
