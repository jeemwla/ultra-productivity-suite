[package]
name = "ultra-suite"
version = "2.2.15"
description = "Ultra Suite: in-taskbar app groups, Code Red Alarm, PC Sentinel"
edition = "2021"

[features]
default = []
dev-edition = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1.0"

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.6"
png = "0.17"
base64 = "0.22"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole",
  "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Power", "Win32_System_Time", "Win32_Security", "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
