<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultra Dock</title>
<style>
/* Matches the Windows 11 taskbar: 40px buttons, 4px corners, soft hover, small running bar */
:root{
  --ink:#ffffff; --ink-2:rgba(255,255,255,.72); --ink-3:rgba(255,255,255,.46);
  --hover:rgba(255,255,255,.075); --press:rgba(255,255,255,.04); --open:rgba(255,255,255,.1);
  --bar:rgba(255,255,255,.55); --bar-active:#60cdff; --line:rgba(255,255,255,.12);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --ease:cubic-bezier(.2,.9,.25,1);
}
@media (prefers-color-scheme: light){:root{ --ink:#000; --ink-2:rgba(0,0,0,.66); --ink-3:rgba(0,0,0,.42);
  --hover:rgba(0,0,0,.05); --press:rgba(0,0,0,.03); --open:rgba(0,0,0,.07); --bar:rgba(0,0,0,.42); --bar-active:#005fb8; --line:rgba(0,0,0,.1); }}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden}
body{font:12px/1 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:default;outline:none}
button:focus-visible{outline:2px solid var(--bar-active);outline-offset:-2px}

.strip{position:absolute;left:0;bottom:0;height:100%;display:flex;align-items:center;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .grp,.strip .win,.strip .more{max-height:100%}
.strip > .group[data-cat="__menu"]{position:sticky;right:0;z-index:3;background:transparent}
/* Small screens: the strip never grows past the taskbar's free space (max-width is set from the measured room).
   An open folder or menu that needs more room hides the other folders until it closes, and scrolls with the wheel. */
.strip.focus > .group:not(.keep){display:none}
.strip.tight .act{padding:0 7px}
/* Nothing in the strip may shrink: the window is narrow while a folder or window list opens, and a shrunken
   strip would measure (and request) too little width, cutting off everything after it. */
.strip > .group, .group > *, .inner > *, .pick > *{flex:none}
/* A folder that is re-drawn while already open appears at full width at once (no slide), so the strip can
   measure its real width in the same frame. */
.tray.now{transition:none}
/* A category with a single app shows that app directly, always visible */
.solo .win{opacity:1;transform:none}
.group{display:flex;align-items:center;height:100%}
.grp{position:relative;height:40px;width:44px;min-width:0;padding:0 6px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;transition:background .12s,width .32s var(--ease),padding .32s var(--ease)}
.grp:hover{background:var(--hover)} .grp:active{background:var(--press)}
.grp[aria-expanded=true]{width:24px;padding:0;background:transparent}
.grp .folder{flex:none;transition:opacity .18s var(--ease),transform .32s var(--ease)}
.grp[aria-expanded=true] .folder{opacity:0;transform:scale(.5);pointer-events:none}
.grp[aria-expanded=true]>.runbar{opacity:0}
.collapse-mark{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .18s var(--ease),transform .32s var(--ease)}
.collapse-mark::after{content:"";width:2px;height:22px;background:var(--ink-3);border-radius:2px}
.grp[aria-expanded=true] .collapse-mark{opacity:1;transform:none}
.grp[aria-expanded=true]:hover .collapse-mark::after{background:var(--ink)}
.grp.now,.grp.now .folder,.grp.now .collapse-mark{transition:none}
@media(prefers-reduced-motion:reduce){.grp,.grp .folder,.grp .collapse-mark,.tray,.tray.open .win{transition:none!important}}
/* Phone-style folder tile: up to 4 real app icons in a 2x2 grid, fully opaque, no overlap */
.folder{position:relative;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  display:grid;grid-template-columns:13px 13px;grid-template-rows:13px 13px;gap:2px;padding:2px;place-content:center}
.folder img,.folder .ph{width:13px;height:13px;border-radius:3px;display:block}
.folder.n1{grid-template-columns:24px;grid-template-rows:24px}.folder.n1 img,.folder.n1 .ph{width:24px;height:24px;border-radius:6px}
.folder .more-n{position:absolute;right:-5px;top:-4px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#3a3a3a;color:#fff;
  font:600 9.5px/15px var(--font);text-align:center;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
@media (prefers-color-scheme: light){.folder{background:rgba(0,0,0,.07);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.folder .more-n{background:#e8e8e8;color:#000}}
.ph{background:var(--line)}
.cnt{font-size:11px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:8px}
.grp .runbar{position:absolute;left:50%;bottom:2px;width:6px;height:3px;border-radius:2px;background:var(--bar);transform:translateX(-50%);transition:width .2s var(--ease),background .2s}
.grp.has-active .runbar{width:14px;background:var(--bar-active)}
.tray{display:flex;align-items:center;height:100%;width:0;overflow:hidden;transition:width .32s var(--ease)}
.tray .inner{display:flex;align-items:center;gap:0;padding:0 2px}
.win{position:relative;width:40px;height:40px;border-radius:4px;display:grid;place-items:center;flex:none;transition:background .12s,transform .15s var(--ease);opacity:0;transform:translateX(-6px)}
.tray.open .win{opacity:1;transform:none;transition:background .12s,opacity .25s var(--ease),transform .3s var(--ease)}
.win:hover{background:var(--hover)} .win:active{background:var(--press);transform:scale(.94)}
.win img{width:24px;height:24px;display:block}
.win .ph{width:24px;height:24px;border-radius:6px}
.win .runbar{position:absolute;left:50%;bottom:2px;width:6px;height:3px;border-radius:2px;background:var(--bar);transform:translateX(-50%);transition:width .2s var(--ease)}
.win.active .runbar{width:16px;background:var(--bar-active)}
/* An app with several windows: one icon, a count, and an inline list of its windows */
.win .wn{position:absolute;right:3px;top:4px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:#3a3a3a;color:#fff;font:600 9px/14px var(--font);text-align:center;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
@media (prefers-color-scheme: light){.win .wn{background:#e8e8e8;color:#000}}
.win[aria-expanded=true]{background:var(--open)}
.pick{display:flex;align-items:center;height:40px;padding:0 2px;margin:0 2px;border-left:1px solid var(--line);border-right:1px solid var(--line);animation:pin .25s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateX(-6px)}}
.wt{height:32px;max-width:170px;padding:0 10px;border-radius:4px;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt:hover{background:var(--hover);color:var(--ink)}
.wt.active{color:var(--ink);font-weight:600}
.pick.dense .wt{max-width:104px;padding:0 7px}
@media (prefers-reduced-motion:reduce){.pick{animation:none}}
.more{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;color:var(--ink-2);transition:background .12s,color .12s}
.more:hover{background:var(--hover);color:var(--ink-2)}
.more svg{width:24px;height:24px}
.more[aria-expanded=true] svg{transform:rotate(180deg)}
.more{position:relative}
.more .udot{position:absolute;right:5px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--bar-active);box-shadow:0 0 0 2px rgba(0,0,0,.25);animation:upulse 2.4s var(--ease) infinite}
@keyframes upulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.act.upd{color:var(--bar-active)}
@media (prefers-reduced-motion:reduce){.more .udot{animation:none}}
.act{height:40px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.act:hover{background:var(--hover);color:var(--ink)}
.act.on{color:var(--bar-active)}
/* "Show up to N apps": minus, the value (click for Automatic), plus */
.capctl{display:flex;align-items:center;height:40px;margin:0 4px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 2px}
.capctl .act{padding:0 8px}
.capctl .act.step{width:28px;padding:0;font-size:15px}
.capctl .act:disabled{opacity:.35}
.empty-hint{font-size:11px;color:var(--ink-3);padding:0 6px}

/* ---------- Uninstall survey ---------- */
body.survey{overflow:auto;background:#f6f7f9;color:#111;font-size:14px;line-height:1.5}
@media (prefers-color-scheme: dark){body.survey{background:#17181b;color:#f0efec}}
.sv{max-width:480px;margin:0 auto;padding:28px 26px}
.sv h1{font:600 20px/1.3 "Segoe UI Variable Display","Segoe UI",sans-serif;margin-bottom:6px}
.sv p{opacity:.72;margin-bottom:18px}
.sv label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid rgba(127,127,127,.25);border-radius:10px;margin-bottom:8px;cursor:pointer}
.sv label:has(input:checked){border-color:#2a78d6;background:rgba(42,120,214,.08)}
.sv textarea{width:100%;min-height:80px;margin-top:6px;border-radius:10px;border:1px solid rgba(127,127,127,.35);padding:10px;font:inherit;background:transparent;color:inherit;resize:vertical}
.sv .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.sv button{height:40px;padding:0 18px;border-radius:10px;font-weight:600;cursor:pointer;border:1px solid rgba(127,127,127,.35)}
.sv button.primary{background:#2a78d6;border-color:#2a78d6;color:#fff}
.sv small{display:block;opacity:.55;margin-top:12px}

.dock-menu{--ink:#fff;--ink-2:#dedfe5;--ink-3:#a5a8b2;--hover:#ffffff15;--line:#ffffff30;position:absolute;width:520px;left:0;bottom:56px;max-width:none;padding:10px;display:grid;grid-template-columns:repeat(3,minmax(max-content,1fr));gap:6px;background:#24262d;color:#fff;border:1px solid #6b6f7d;border-radius:12px;box-shadow:0 4px 14px #0005}
.dock-menu[hidden]{display:none}
.dock-menu .act{min-width:max-content;height:36px;padding:0 12px;text-align:left;white-space:nowrap;flex:none}
.dock-menu .capctl{grid-column:1 / -1;justify-content:center}
.dock-menu .menu-note{grid-column:1 / -1;white-space:normal;font-size:12px;line-height:1.4;color:#ddd;max-width:460px;padding:4px}
@media(max-width:360px){.dock-menu{grid-template-columns:repeat(2,minmax(max-content,1fr));padding:6px;gap:2px}}
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<div id="dock-menu" class="dock-menu" hidden role="menu" aria-label="Dock menu"></div>
<div class="sv" id="survey" hidden>
  <h1>Sorry to see you go</h1>
  <p>Before Ultra Suite is removed, would you tell us why? It takes five seconds and helps make it better for everyone.</p>
  <form id="sf">
    <label><input type="radio" name="r" value="not-useful"> It isn't useful for me</label>
    <label><input type="radio" name="r" value="too-complicated"> Too complicated to set up</label>
    <label><input type="radio" name="r" value="something-broke"> Something didn't work</label>
    <label><input type="radio" name="r" value="performance"> It slowed my PC down</label>
    <label><input type="radio" name="r" value="found-better"> I found a better app</label>
    <label><input type="radio" name="r" value="reinstalling"> Just reinstalling</label>
    <label><input type="radio" name="r" value="other"> Something else</label>
    <textarea id="sm" maxlength="1000" placeholder="Anything else? (optional)"></textarea>
    <div class="row"><button type="button" id="skip">Skip</button><button type="submit" class="primary" id="send">Send and uninstall</button></div>
    <small>Anonymous: only your answer, the app version and Windows are sent.</small>
  </form>
</div>
<script>
const T = window.__TAURI__, invoke = T && T.core ? T.core.invoke : null;
const view = new URLSearchParams(location.search).get("view") || "strip";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (id) => document.getElementById(id);

/* ---------------- Uninstall survey ---------------- */
if (view === "survey") {
  document.body.className = "survey"; $("survey").hidden = false; $("strip").hidden = true;
  const done = () => invoke && invoke("quit");
  $("skip").onclick = async () => { if (invoke) await invoke("send_event", { kind: "uninstall", reason: null, message: null }).catch(() => {}); done(); };
  $("sf").onsubmit = async (e) => {
    e.preventDefault(); $("send").disabled = true; $("send").textContent = "Sending…";
    const r = (document.querySelector("input[name=r]:checked") || {}).value || "unspecified";
    if (invoke) await invoke("send_event", { kind: "uninstall", reason: r, message: $("sm").value.trim() || null }).catch(() => {});
    done();
  };
}

/* ---------------- Taskbar organizer ---------------- */
const icons = new Map();          // exe path -> data url
let state = { windows: [], organize: true, order: [] }, open = null, sig = "", closeTimer = 0;
const CHEV = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>';

function iconFor(exe, hwnd){
  if (icons.has(exe)) return icons.get(exe);
  icons.set(exe, null);
  if (invoke) invoke("get_icon", { target: exe, hwnd: hwnd ?? null }).then(u => { if (u) { icons.set(exe, u); document.querySelectorAll(`img[data-exe="${CSS.escape(exe)}"]`).forEach(i => i.src = u);
    document.querySelectorAll(`.ph[data-exe="${CSS.escape(exe)}"]`).forEach(p => { const i = document.createElement("img"); i.dataset.exe = exe; i.src = u; i.alt = ""; p.replaceWith(i); }); } }).catch(() => {});
  return null;
}
const hwndOf = (exe) => (state.windows.find(w => w.exe === exe) || {}).hwnd;
const img = (exe) => { const u = iconFor(exe, hwndOf(exe)); return u ? `<img data-exe="${esc(exe)}" src="${u}" alt="">` : `<span class="ph" data-exe="${esc(exe)}"></span>`; };

function groups(){
  const by = new Map();
  for (const w of state.windows) { if (!by.has(w.category)) by.set(w.category, []); by.get(w.category).push(w); }
  const order = state.order.length ? state.order : [...by.keys()];
  return [...by.entries()].sort((a, b) => (order.indexOf(a[0]) + 1 || 99) - (order.indexOf(b[0]) + 1 || 99));
}

/* "Inbox (3) - Gmail - Opera" -> "Inbox (3) - Gmail": drop the trailing app name, keep it short */
function shortTitle(t, n){
  const parts = String(t || "").split(/ [-–—] /);
  const s = (parts.length > 1 ? parts.slice(0, -1).join(" - ") : parts[0]).trim() || `Window ${n}`;
  return s.length > 28 ? s.slice(0, 27).trimEnd() + "…" : s;
}
let pick = null;  // exe whose window list is showing
function appButton(exe, wins){
  const active = wins.some(w => w.active), many = wins.length > 1, shown = many && pick === exe;
  const name = exe.split(/[\\/]/).pop().replace(/\.exe$/i, "");
  const btn = `<button class="win ${active ? "active" : ""}" data-exe="${esc(exe)}" data-h="${wins[0].hwnd}" ${many ? `aria-expanded="${shown}"` : ""}
    title="${esc(many ? `${name}: ${wins.length} windows` : wins[0].title)}">${img(exe)}${many ? `<span class="wn">${wins.length}</span>` : ""}<span class="runbar"></span></button>`;
  if (!shown) return btn;
  return btn + `<span class="pick ${wins.length > 4 ? "dense" : ""}" role="menu" aria-label="${esc(name)} windows">${wins.map((w, i) =>
    `<button class="wt ${w.active ? "active" : ""}" role="menuitem" data-h="${w.hwnd}" title="${esc(w.title)}">${esc(shortTitle(w.title, i + 1))}</button>`).join("")}</span>`;
}

/* Free taskbar space for the strip in CSS pixels, measured by the app (Infinity until measured) */
const room = () => (typeof state.avail === "number" && state.avail >= 0 ? state.avail : Infinity);
/* The folders and apps to show, planned by the app to fit the free space (max 6 apps per folder, no one-app
   folders, "More apps" folders when space is short). Without a plan (older app, preview) group by category. */
function layoutItems(){
  if (state.layout && Array.isArray(state.layout.items)) return state.layout.items;
  return groups().map(([cat, ws]) => { const exes = [...new Set(ws.map(w => w.exe))]; return { key: cat, label: cat, folder: exes.length > 1, exes }; });
}
let shownHwnds = [], baseW = 0;
/* An open folder, menu or window list wider than the free space: show only it until it closes */
function applyFocus(){
  const s = $("strip");
  s.classList.remove("focus"); s.querySelectorAll(".group.keep").forEach(g => g.classList.remove("keep"));
  s.classList.toggle("tight", room() < 360);
  s.style.maxWidth = isFinite(room()) ? room() + "px" : "";
  if (open === "__menu") return;
  const target = open ? [...s.children].find(g => g.dataset.cat === open) : pick ? s.querySelector('.win[aria-expanded="true"]')?.closest(".group") : null;
  if (!target) return;
  const tray = open && target.querySelector(".tray"), inner = tray && tray.querySelector(".inner");
  const extra = inner ? Math.max(0, inner.scrollWidth - tray.offsetWidth) : 0;
  if (s.scrollWidth + extra + 2 > room()) { target.classList.add("keep"); s.classList.add("focus"); s.scrollLeft = 0; }
}
/* The owner's "show up to N apps" setting: the first N apps get their own button, the rest go into folders.
   null means Automatic (folders by category). Minus and plus start from what the strip shows now. */
const CAP_MAX = 30;
const capOf = () => (typeof state.cap === "number" ? state.cap : null);
const looseNow = () => layoutItems().filter(i => !i.folder).length;
function capControl(){
  const c = capOf();
  const label = c === null ? "Apps: Auto" : c === 0 ? "Apps: 0" : `Apps: ${c}`;
  const tip = c === null ? "Automatic: apps are grouped into folders by category. Use minus or plus to choose how many apps show on their own."
    : `Up to ${c} app${c === 1 ? "" : "s"} show on their own, the rest go into folders. Click to go back to Automatic.`;
  return `<span class="capctl" role="group" aria-label="Apps shown on their own">
    <button class="act step" data-act="cap-" aria-label="Fewer apps on their own" ${c === 0 ? "disabled" : ""}>−</button>
    <button class="act ${c === null ? "" : "on"}" data-act="capauto" title="${esc(tip)}">${label}</button>
    <button class="act step" data-act="cap+" aria-label="More apps on their own" ${c === CAP_MAX ? "disabled" : ""}>+</button></span>`;
}
function nextCap(c, dir, shown){
  if (c === null) return Math.max(0, Math.min(CAP_MAX, shown + dir));
  return Math.max(0, Math.min(CAP_MAX, c + dir));
}
async function setCap(c){
  const previous = state.cap;
  state.cap = c;
  if (invoke) { try { await invoke("set_dock_cap", { cap: c }); } catch (e) { state.cap = previous; state.fallback_reason = `Could not save app count: ${String(e)}`; } }
  sig = ""; render();
}
function render(){
  const activeElement = document.activeElement;
  const focusKey = el => [el.classList.contains("grp") ? "grp" : el.classList.contains("more") ? "more" : el.classList.contains("wt") ? "wt" : el.classList.contains("win") ? "win" : "act",el.dataset.cat,el.dataset.exe,el.dataset.h,el.dataset.act].join("|");
  const oldFocus = $("strip").contains(activeElement) && activeElement.tagName === "BUTTON" ? focusKey(activeElement) : null;
  const items = layoutItems(), shown = new Set();
  const html = items.map((it, index) => {
    const ws = state.windows.filter(w => it.exes.includes(w.exe));
    if (!ws.length) return "";
    ws.forEach(w => shown.add(w.hwnd));
    const cat = it.key, label = it.label || it.key;
    const uniq = it.exes.map(e => ws.find(w => w.exe === e)).filter(Boolean);
    const active = ws.some(w => w.active);
    // One app: a folder would only add a click, so show the app itself (never a one-app folder)
    if (!it.folder || uniq.length === 1) return `<div class="group solo" data-cat="${esc(cat)}">${appButton(uniq[0].exe, ws.filter(w => w.exe === uniq[0].exe))}</div>`;
    return `<div class="group" data-cat="${esc(cat)}">
      <button class="grp ${active ? "has-active" : ""} ${open === cat ? "now" : ""}" data-cat="${esc(cat)}" data-label="${esc(label)}" aria-expanded="${open === cat}" aria-controls="group-tray-${index}" aria-label="${esc((open === cat ? "Collapse " : "Expand ") + label)}" title="${esc(open === cat ? `Collapse ${label} back into a folder` : label + ': ' + ws.map(w => w.title).slice(0,6).join(' · '))}">
        <span class="folder" aria-hidden="true">${uniq.slice(0, 4).map(w => img(w.exe)).join("")}${uniq.length > 4 ? `<span class="more-n">${uniq.length}</span>` : ""}</span><span class="collapse-mark" aria-hidden="true"></span><span class="runbar"></span></button>
      <div id="group-tray-${index}" class="tray ${open === cat ? "open now" : ""}" aria-hidden="${open !== cat}" ${open !== cat ? "inert" : ""}><div class="inner">${uniq.map(u => appButton(u.exe, ws.filter(w => w.exe === u.exe))).join("")}</div></div></div>`;
  }).join("");
  shownHwnds = [...shown];
  const upAct = update ? `<button class="act upd" data-act="update" title="You have ${esc(update.current)}">${esc(update.label || `Update to ${update.latest}`)}</button>` : "";
  const menu = `<div class="group solo" data-cat="__menu"><button class="more" data-cat="__menu" aria-label="Dock menu" aria-expanded="${open === "__menu"}" title="${esc(state.fallback_reason || "Dock menu")}">${CHEV}${update ? '<span class="udot"></span>' : ""}</button></div>`;
  const popup = $("dock-menu");
  popup.hidden = open !== "__menu";
  popup.style.width = Math.min(520, room()) + "px";
  popup.innerHTML = `${upAct}<button class="act" data-act="showall">${state.organize ? "Show all" : "Organize"}</button>
      <button class="act" data-act="sentinel">Sentinel</button><button class="act" data-act="alarm">Alarm</button>
      ${capControl()}<button class="act" data-act="edit">Edit folders</button><button class="act" data-act="settings">Settings</button><button class="act" data-act="quit">Quit</button>
      ${state.fallback_reason ? `<div class="menu-note" role="status">${esc(state.fallback_reason)}</div>` : ""}`;
  $("strip").innerHTML = html + menu;
  if (oldFocus && document.hasFocus()) {
    const replacement = [...$("strip").querySelectorAll("button")].find(button => focusKey(button) === oldFocus && !button.closest("[inert]"));
    replacement?.focus({preventScroll:true});
  }
  // keep any open tray at its natural width
  $("strip").querySelectorAll(".tray.open").forEach(t => t.style.width = t.querySelector(".inner").scrollWidth + "px");
  applyFocus();
  requestAnimationFrame(report);
}
/* Only windows the strip actually shows may lose their native button; the rest stay on the taskbar */
function report(){
  if (!invoke) return;
  // Native menus are separate transient surfaces. The persistent strip always stays one taskbar row tall.
  const full = Math.ceil($("strip").scrollWidth) + 8;
  if (!open && !pick) baseW = full;
  else if (state.layout && state.layout.width) baseW = Math.ceil(state.layout.width);
  invoke("set_strip_width", { width: Math.min(full, room()), rendered: shownHwnds, base: baseW, height: 48 });
}

function setOpen(cat){
  const prev = open; open = cat;
  if (cat === "__menu" || prev === "__menu") { render(); return; }
  if (pick && prev !== cat) { pick = null; render(); }  // a window list never outlives its folder
  $("strip").querySelectorAll(".group:not(.solo)").forEach(g => {
    const isOpen = g.dataset.cat === cat, tray = g.querySelector(".tray"), b = g.querySelector(".grp,.more");
    b.setAttribute("aria-expanded", isOpen);
    if (b.classList.contains("grp")) {
      b.classList.remove("now");
      const label = (b.dataset && b.dataset.label) || g.dataset.cat;
      b.setAttribute("aria-label", (isOpen ? "Collapse " : "Expand ") + label);
      b.title = isOpen ? `Collapse ${label} back into a folder` : `Expand ${label}`;
    }
    tray.inert = !isOpen;
    tray.setAttribute("aria-hidden", !isOpen);
    tray.classList.remove("now");  // opening and closing by click slide as usual
    if (isOpen) { // grow the window first, then slide in
      const w = tray.querySelector(".inner").scrollWidth;
      applyFocus();
      if (invoke) invoke("set_strip_width", { width: Math.min(Math.ceil($("strip").scrollWidth + w) + 4, room() + 2) });
      requestAnimationFrame(() => { if (!g.isConnected || open !== g.dataset.cat) return; tray.style.width = w + "px"; tray.classList.add("open"); });
    } else { tray.style.width = "0px"; tray.classList.remove("open"); }
  });
  if (cat === null) applyFocus();
  setTimeout(report, 340); // settle the measured native width after either transition
}

async function handleDockClick(e){
  const g = e.target.closest(".grp,.more"), w = e.target.closest(".win"), t = e.target.closest(".wt"), a = e.target.closest(".act");
  if (g) {
    if (g.dataset.cat === "__menu" && invoke) {
      closeAll();
      try { await invoke("show_dock_menu"); } catch { await invoke("open_dock_settings"); }
      return;
    }
    setOpen(open === g.dataset.cat ? null : g.dataset.cat); return;
  }
  if (t) { if (invoke) await invoke("activate", { hwnd: +t.dataset.h }); setTimeout(closeAll, 220); return; }
  if (w) {
    if (w.hasAttribute("aria-expanded")) { pick = pick === w.dataset.exe ? null : w.dataset.exe; render(); return; }  // several windows: show or hide the list
    if (invoke) await invoke("activate", { hwnd: +w.dataset.h }); setTimeout(() => setOpen(null), 220); return;
  }
  if (a) {
    const k = a.dataset.act;
    if (k === "showall") { state.organize = !state.organize; if (invoke) await invoke("set_organize", { on: state.organize }); sig = ""; }
    // the cap controls keep the menu open so several steps can be taken in a row
    if (k === "cap-" || k === "cap+") { await setCap(nextCap(capOf(), k === "cap+" ? 1 : -1, looseNow())); return; }
    if (k === "capauto") { if (capOf() !== null) await setCap(null); return; }
    if (k === "sentinel" || k === "alarm") invoke && invoke("open_app_view", { name: k });
    if (k === "edit") invoke && invoke("open_dock_editor");
    if (k === "settings") invoke && invoke("open_dock_settings");
    if (k === "quit") invoke && invoke("quit");
    if (k === "update") { installUpdate(); return; }  // keep the menu open so the progress text stays visible
    setTimeout(() => setOpen(null), 150);
  }
}
$("strip").addEventListener("click", handleDockClick);
$("dock-menu").addEventListener("click", handleDockClick);
/* Close any open folder and window list (a single app's list lives outside any folder) */
function closeAll(){
  if (open) { setOpen(null); return; }  // setOpen also clears a list inside the folder
  if (pick) { pick = null; render(); }
}
// A menu stays open while the pointer crosses the gap to its upward panel.
$("strip").addEventListener("mouseleave", () => { if (open !== "__menu") { clearTimeout(closeTimer); closeTimer = setTimeout(closeAll, 1200); } });
$("dock-menu").addEventListener("mouseenter", () => clearTimeout(closeTimer));
$("strip").addEventListener("mouseenter", () => clearTimeout(closeTimer));
/* A strip wider than the free space (an open folder on a small screen) scrolls sideways with the wheel */
$("strip").addEventListener("wheel", e => { const s = $("strip"); if (s.scrollWidth > s.clientWidth + 1) { s.scrollLeft += e.deltaY || e.deltaX; e.preventDefault(); } }, { passive: false });
document.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); closeAll(); } });

async function poll(){
  try {
    const s = invoke ? await invoke("get_windows") : { organize: true, order: [], windows: [] };
    const nsig = JSON.stringify([s.organize, s.fallback_reason, s.windows.map(w => [w.hwnd, w.category, w.active, w.title]), s.layout && s.layout.items, s.avail, s.cap]);
    state = s;
    // Commit the signature only after a successful render. Otherwise a transient
    // render exception would prevent retries while polling still looked healthy.
    if (nsig !== sig) { render(); sig = nsig; }
    else report();
  } catch {}
}
/* ---------------- Update dot ----------------
   The core checks GitHub (cached for 6 hours); a dot on the menu chevron says a new version is out. */
let CORE = "http://127.0.0.1:8081", SELF_UPDATE = true;
if (invoke) invoke("edition_info").then((e) => { CORE = `http://127.0.0.1:${e.ports.alarm}`; SELF_UPDATE = e.self_update !== false; }).catch(() => {});
let update = null;
async function checkUpdate(){
  if (!SELF_UPDATE) { if (update) { update = null; render(); } return; }  // Dev: local builds only
  try {
    const u = await (await fetch(`${CORE}/api/update`, { cache: "no-store" })).json();
    const next = u && u.available && u.asset ? { latest: u.latest, current: u.current, label: update && update.latest === u.latest ? update.label : null } : null;
    if (JSON.stringify(next) !== JSON.stringify(update)) { update = next; render(); }
  } catch {}
}
function setUpdateLabel(text){
  if (!update) return; update.label = text;
  const b = $("dock-menu").querySelector('[data-act="update"]'); if (!b) return;
  b.textContent = text;
  const tray = b.closest(".tray"); if (tray && tray.classList.contains("open")) { const w = tray.querySelector(".inner").scrollWidth; tray.style.width = w + "px"; report(); }
}
async function installUpdate(){
  if (!update || update.busy) return; update.busy = true; setUpdateLabel("Downloading…");
  try {
    const r = await fetch(`${CORE}/api/update/install`, { method: "POST" });
    if (!r.ok) throw new Error();
    setUpdateLabel("Installing…");  // the installer closes Ultra Suite, updates it and opens it again
  } catch { update.busy = false; setUpdateLabel("Update failed, try again"); }
}
if (view === "strip") { poll(); setInterval(poll, 700); setTimeout(checkUpdate, 8000); setInterval(checkUpdate, 30 * 60 * 1000); }
</script>
