<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Starting app</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="suite.css">
<style>
/* Shown while an app's local service starts. The app replaces the status text and enables Try again through the
   ids title, status and retry, so those stay as they are. */
body{min-height:100vh;display:grid;place-items:center;padding:var(--s-6)}
main{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-5);padding:var(--s-8);box-shadow:var(--sh-2)}
h1{font:var(--w-bold) var(--t-6)/var(--lh-tight) var(--font-display);margin-bottom:var(--s-2)}
p{color:var(--ink-2);margin-bottom:var(--s-5)}
#retry{gap:var(--s-2)}
/* While the button is disabled the page is waiting on the service: a small spinner says it is still working */
#retry:disabled{opacity:1;color:var(--ink-2);cursor:progress}
#retry:disabled::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Try again enabled means the service did not come up: make it the main action and mark the message */
#retry:not(:disabled){background:var(--accent);color:var(--accent-ink);border-color:transparent}
#retry:not(:disabled):hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
main:has(#retry:not(:disabled)) #status{color:var(--warn)}
@media (prefers-reduced-motion:reduce){#retry:disabled::before{animation:none;border-color:var(--accent)}}
</style></head>
<body><main><h1 id="title">Starting app…</h1><p id="status" role="status">Waiting for the local service. This window will open the app when it is ready.</p><button id="retry" class="btn" disabled>Checking the service…</button></main>
<script src="no_context_menu.js"></script>
<script>
const app=new URLSearchParams(location.search).get('app');
const names={sentinel:'PC Sentinel',alarm:'Code Red Alarm',insights:'Ultra Suite Insights'};
document.getElementById('title').textContent=names[app]?'Starting '+names[app]+'…':'App unavailable';
document.getElementById('retry').addEventListener('click',async()=>{
 const button=document.getElementById('retry');button.disabled=true;button.textContent='Checking the service…';
 try{await window.__TAURI__.core.invoke('open_app_view',{name:app});}
 catch{document.getElementById('status').textContent='The app could not be opened. Try again.';button.disabled=false;button.textContent='Try again';}
});
</script></body></html>
