name: Label pull requests

# Adds app labels (dock, sentinel, alarm, core, insights, installer, documentation, ci) from the
# changed paths in .github/labeler.yml. pull_request_target lets fork pull requests be labeled too;
# it runs the workflow from main and never checks out or runs pull request code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
