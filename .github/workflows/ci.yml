name: CI

# Runs every test suite on Windows for pushes to main, every pull request (drafts included),
# merge queue groups, manual runs and once a week. The "CI result" job is the single required check.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Tuesdays 10:17 UTC: catches breakage from runner image, toolchain or dependency changes
    # in weeks without commits.
    - cron: "17 10 * * 2"

permissions:
  contents: read

# One run per branch or PR: a newer push cancels the older pull request run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: pwsh

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Check tracked files and versions
        run: python -I .github/scripts/repo_guard.py
      - name: Compile every Python file
        # Catches syntax errors in modules that no test imports.
        run: python -I -m compileall -q -j 0 (git ls-files '*.py')
      - name: Parse JavaScript files and inline page scripts
        run: node .github/scripts/syntax_check.cjs
      - name: Parse PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -File .github/scripts/ps_parse_check.ps1

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflow files
        run: '"$RUNNER_TEMP/actionlint" -color'

  python:
    name: Python tests (${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.13 matches the build PC. 3.11 is the oldest version build_release.ps1, fastapi and Pillow support.
        python: ["3.13", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install runtime and build requirements
        # requirements-build.txt pins Pillow, which the icon tests import, and the PyInstaller versions the build checks.
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run unittest suite
        shell: bash
        run: |
          # Tests keep their temporary folders under the gitignored private/ folder, which a fresh checkout lacks.
          mkdir -p private
          # The build-helper tests keep PowerShell fixtures under D:\claude (the owner's layout). The runner has a D: drive.
          mkdir -p /d/claude
          set +e
          python -W ignore -m unittest discover -s tests 2>&1 | tee "$RUNNER_TEMP/python-tests.txt"
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### Python ${{ matrix.python }} tests"
            grep -E '^(Ran [0-9]+ tests|OK|FAILED)' "$RUNNER_TEMP/python-tests.txt" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Keep the test log when the suite fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.python }}-test-log
          path: ${{ runner.temp }}/python-tests.txt
          retention-days: 7

  node:
    name: Node tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Run node:test suite
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout `
            --test-reporter=junit --test-reporter-destination="$env:RUNNER_TEMP/node-junit.xml" "tests/*.test.cjs"
          $code = $LASTEXITCODE
          [xml]$junit = Get-Content -Raw "$env:RUNNER_TEMP/node-junit.xml"
          $cases = @($junit.SelectNodes('//testcase')).Count
          $failed = @($junit.SelectNodes('//testcase[failure]')).Count
          "### Node tests`n- $cases tests, $failed failed" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Keep the JUnit report when the suite fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-junit
          path: ${{ runner.temp }}/node-junit.xml
          retention-days: 7

  rust:
    name: Rust tests (Public and Dev)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ultra_dock/src-tauri -> target
      - name: Create bundle resource folders
        run: |
          # tauri-build checks that bundle resources exist. Tests do not need the real packaged core or app icons.
          New-Item -ItemType Directory -Force -Path build/dist/ultrasuite-core, ultra_dock/src-tauri/appicons | Out-Null
          Set-Content -Path build/dist/ultrasuite-core/README.txt -Value "CI placeholder; the real core comes from build_release.ps1."
          Set-Content -Path ultra_dock/src-tauri/appicons/README.txt -Value "CI placeholder; real icons come from make_icons.py."
      - name: Test Public edition
        working-directory: ultra_dock/src-tauri
        run: cargo test --release --locked
      - name: Test Dev edition
        working-directory: ultra_dock/src-tauri
        run: cargo test --release --locked --features dev-edition

  result:
    name: CI result
    if: always()
    needs: [hygiene, workflows, python, node, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::At least one CI job did not pass."
            exit 1
          fi
